<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your Pawfolk account to view saved favorites, manage grooming visits, and reorder pet favorites.">
  <title>Pawfolk | Sign In</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <script>try{const t=localStorage.getItem('pawfolk-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dir=localStorage.getItem('pawfolk-direction')||'ltr'}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#signin-email">Skip to sign in form</a>
  <main class="auth-shell">
    <section class="auth-art">
      <a class="brand" href="../index.html" aria-label="Pawfolk home">
        <span class="brand__mark" aria-hidden="true"><span class="brand__eyes"></span></span>
        <span>Pawfolk</span>
      </a>
      <div class="auth-mascot" aria-hidden="true">
        <i class="fa-solid fa-dog"></i>
      </div>
      <div>
        <p class="lead"><strong>Good to see you again.</strong></p>
        <p>Your saved favorites and grooming records have been sitting very patiently.</p>
      </div>
    </section>

    <section class="auth-form-wrap">
      <form class="auth-form" data-validate data-success="Welcome back! Signed in for demo." novalidate>
        <div class="nav-actions">
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch color theme"></button>
          <button class="icon-btn" type="button" data-dir-toggle aria-label="Switch text direction">RTL</button>
          <a class="btn btn--paper btn--sm" href="../index.html"><i class="fa-solid fa-house" aria-hidden="true"></i> Home</a>
        </div>

        <p class="eyebrow">Welcome back</p>
        <h1>Sign in.</h1>
        <p class="lead muted" style="margin-bottom:28px">No account yet? <a class="text-link" href="signup.html">Join the pack</a></p>

        <div class="form-group">
          <label for="signin-email">Email Address</label>
          <input class="field" id="signin-email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <p class="field-error" aria-live="polite"></p>
        </div>

        <div class="form-group" style="margin-top:18px">
          <label for="signin-password">Password</label>
          <div class="password-wrap">
            <input class="field" id="signin-password" type="password" autocomplete="current-password" minlength="8" placeholder="••••••••" required>
            <button class="password-toggle-btn" type="button" aria-label="Toggle password visibility"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
          </div>
          <p class="field-error" aria-live="polite"></p>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin:20px 0 28px;flex-wrap:wrap">
          <label class="checkbox">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a class="text-link" href="contact.html">Forgot password?</a>
        </div>

        <button class="btn btn--blue btn--full" type="submit">Sign In to Pawfolk <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
      </form>
    </section>
  </main>
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
