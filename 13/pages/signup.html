<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a Glowé account.">
  <title>Sign Up — Glowé</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body data-page="signup" data-depth="1">
  <div data-site-header></div>
  <main id="main-content">
    <section class="auth-wrap">
      <div class="auth-art" role="img" aria-label="Glowé skincare collection"></div>
      <div class="auth-panel">
        <div class="auth-card" data-reveal>
          <span class="eyebrow">Account Registration</span>
          <h1>Sign Up</h1>
          <p class="lead">Create an account to save routines, favorites and your quiz results.</p>
          <form data-validate data-success="Your demo account details look great." novalidate>
            <div class="field">
              <label for="signup-name">Full name</label>
              <input id="signup-name" name="name" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="signup-email">Email address</label>
              <input id="signup-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="signup-password">Password</label>
              <div class="password-wrap">
                <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                <button class="icon-btn password-toggle" type="button" aria-label="Show password"><i data-lucide="eye"></i></button>
              </div>
            </div>
            <label class="check-row"><input type="checkbox" required> I accept the <a class="accent" href="terms.html">Terms</a> and <a class="accent" href="privacy.html">Privacy Policy</a>.</label>
            <button class="btn btn-coral" style="width:100%;margin-top:22px" type="submit">Sign Up <i data-lucide="arrow-right"></i></button>
          </form>
          <p style="text-align:center;margin-top:20px" class="muted">Already a member? <a class="accent" href="signin.html">Sign In</a></p>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="../assets/js/lucide.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
