<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset your Glowé account password.">
  <title>Forgot Password — Glowé</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body data-page="forgot-password" data-depth="1">
  <div data-site-header></div>
  <main id="main-content">
    <section class="auth-wrap">
      <div class="auth-art" role="img" aria-label="Glowé skincare collection"></div>
      <div class="auth-panel">
        <div class="auth-card" data-reveal>
          <span class="eyebrow">Account Recovery</span>
          <h1>Reset Password</h1>
          <p class="lead">Enter the email address associated with your account and we’ll send you instructions to reset your password.</p>
          <form data-validate data-success="Password reset link sent! Check your inbox for instructions." novalidate>
            <div class="field">
              <label for="reset-email">Email address</label>
              <input id="reset-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
            </div>
            <button class="btn btn-coral" style="width:100%;margin-top:10px" type="submit">Send Reset Link <i data-lucide="arrow-right"></i></button>
          </form>
          <div style="text-align:center;margin-top:24px;display:grid;gap:8px" class="muted">
            <p style="margin:0">Remember your password? <a class="accent" href="signin.html">Sign In</a></p>
            <p style="margin:0">Need an account? <a class="accent" href="signup.html">Create an account</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="../assets/js/lucide.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
