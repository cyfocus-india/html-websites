<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign in to your DriveWay student dashboard.">
  <title>Sign In | DriveWay</title>
  <link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="../assets/js/main.js" defer></script>
</head>
<body>
  <div data-site-header></div>
  <main id="main-content">
    <section class="form-shell" aria-labelledby="signin-title">
      <span class="tag">Student portal</span><h1 id="signin-title">Sign In</h1><p>Sign in to book lessons and track your progress.</p>
      <div class="form-message" role="status">Login successful. Opening your dashboard…</div>
      <form class="validate-form" novalidate data-success="Login successful. Opening your dashboard…" data-redirect="dashboard.html">
        <div class="field"><label for="signin-email">Email address</label><input id="signin-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required><div class="field-error"></div></div>
        <div class="field"><label for="signin-password">Password</label><input id="signin-password" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="Enter your password" required><div class="field-error"></div></div>
        <button class="btn btn-primary" type="submit">Sign In <i data-lucide="arrow-right"></i></button>
      </form>
      <p style="margin-top:20px">New student? <a href="signup.html" style="color:var(--orange);font-weight:700">Create an account</a></p>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
