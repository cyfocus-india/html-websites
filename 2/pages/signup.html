<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create a DriveWay student account."><title>Sign Up | DriveWay</title>
  <link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="../assets/js/main.js" defer></script>
</head>
<body>
  <div data-site-header></div><main id="main-content"><section class="form-shell" aria-labelledby="signup-title"><span class="tag">Student Portal</span><h1 id="signup-title">Sign Up</h1><p>Set up your student profile in a minute.</p><div class="form-message" role="status"></div><form class="validate-form" novalidate data-success="Account created. Taking you to sign in…" data-redirect="signin.html"><div class="form-row"><div class="field"><label for="first-name">First name</label><input id="first-name" name="firstName" autocomplete="given-name" required><div class="field-error"></div></div><div class="field"><label for="last-name">Last name</label><input id="last-name" name="lastName" autocomplete="family-name" required><div class="field-error"></div></div></div><div class="field"><label for="signup-email">Email</label><input id="signup-email" name="email" type="email" autocomplete="email" required><div class="field-error"></div></div><div class="field"><label for="signup-phone">Phone</label><input id="signup-phone" name="phone" type="tel" pattern="[0-9+ ()-]{8,}" autocomplete="tel" required><div class="field-error"></div></div><div class="field"><label for="signup-password">Password</label><input id="signup-password" name="password" type="password" minlength="6" autocomplete="new-password" required><div class="field-error"></div></div><button class="btn btn-primary" type="submit">Sign Up</button></form><p style="margin-top:20px">Already registered? <a href="signin.html" style="color:var(--orange);font-weight:700">Sign in</a></p></section></main><div data-site-footer></div>
</body>
</html>
