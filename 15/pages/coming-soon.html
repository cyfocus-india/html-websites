<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A brighter update is on the way. Sign up to get notified when SolarNest launches new features.">
  <title>Coming Soon — SolarNest</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="../assets/js/main.js" defer></script>
</head>
<body data-page="coming-soon">
  <div id="site-header"></div>
  <main id="main-content" class="empty-state" style="padding: 50px 20px;">
    <div class="coming-soon-card card reveal">
      <div class="coming-soon-icon">
        <i data-lucide="sun"></i>
      </div>
      <span class="eyebrow">A brighter update is on the way</span>
      <h1 style="font-size: clamp(2.2rem, 5vw, 3.2rem); margin: 0 0 12px; letter-spacing: -0.04em;">Coming Soon.</h1>
      <p class="muted" style="max-width: 460px; margin: 0 auto; font-size: 0.96rem;">We’re preparing an all-new SolarNest platform with live rooftop telemetry, smart energy sizing, and one-click PM Surya Ghar subsidy tracking.</p>
      
      <div class="coming-soon-features">
        <span class="coming-soon-badge"><i data-lucide="zap"></i> Live Telemetry</span>
        <span class="coming-soon-badge"><i data-lucide="cpu"></i> Smart Sizing</span>
        <span class="coming-soon-badge"><i data-lucide="shield-check"></i> DISCOM Sync</span>
      </div>

      <form class="notify-form validated-form" novalidate>
        <div class="notify-input-group">
          <input type="email" name="email" required aria-label="Email address" placeholder="Enter your email for early access">
          <button type="submit"><i data-lucide="bell"></i> Notify Me</button>
        </div>
        <div class="field-error" aria-live="polite" style="margin-top: 8px; font-size: 0.76rem;"></div>
      </form>

      <div style="margin-top: 18px;">
        <a class="btn btn-outline btn-sm" href="../index.html"><i data-lucide="home"></i> Return Home</a>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
</body>
</html>
