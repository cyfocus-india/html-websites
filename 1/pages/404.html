<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 | Oven &amp; Bloom</title>
    <meta
      name="description"
      content="404 Page Not Found. Return to the Oven &amp; Bloom cake shop."
    />
    <meta name="robots" content="noindex" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/dark-mode.css" />

  <body>
    <main class="utility-page">
      <div class="page-actions">
        <button
          class="icon-btn"
          type="button"
          data-direction-toggle
          aria-label="Switch to Right-to-Left layout (RTL)"
          aria-pressed="false"
        >
          <span class="dir-badge" aria-hidden="true">RTL</span>
        </button>
        <button
          class="icon-btn"
          type="button"
          data-theme-toggle
          aria-label="Use dark theme"
          aria-pressed="false"

          <i class="ph ph-moon" aria-hidden="true"></i>
        </button>
      </div>
      <div class="utility-page__content">
        <a class="brand" href="../index.html"
          ><span class="brand-mark"><i class="ph ph-cake"></i></span

        >
        <div class="utility-code">404</div>
        <h1 style="font-size: clamp(3rem, 8vw, 7rem)">
          Page Not Found
        </h1>
        <p class="lead">
          The page you were looking for could not be found. Return to Home 1 or explore our cakes.
        </p>
        <div class="btn-row" style="justify-content: center">
          <a class="btn btn--primary" href="../index.html">Home 1</a

        </div>
      </div>

    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
    <script src="../assets/js/main.js" defer></script>
