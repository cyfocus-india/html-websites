<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Explorer Zone (3-5 Years) - Preschooler building blocks -->
  <defs>
    <radialGradient id="bgExplorer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bgExplorer)"/>

  <!-- Play Area Floor -->
  <rect y="230" width="300" height="70" fill="#3B82F6" opacity="0.15"/>

  <!-- Stacking Toy Blocks on Left -->
  <rect x="50" y="195" width="40" height="40" rx="4" fill="#EF4444"/>
  <rect x="50" y="155" width="40" height="40" rx="4" fill="#F59E0B"/>
  <rect x="50" y="115" width="40" height="40" rx="4" fill="#10B981"/>
  <polygon points="50,115 70,80 90,115" fill="#3B82F6"/>

  <!-- Child Sitting Happily (Explorer 3-5 Years) -->
  <!-- Legs -->
  <path d="M 140 230 L 190 230 L 210 260 L 170 260 Z" fill="#1E3A8A"/>
  <ellipse cx="205" cy="265" rx="14" ry="9" fill="#EF4444"/>

  <!-- Torso (Striped Yellow/Green T-Shirt) -->
  <path d="M 130 160 L 190 160 L 195 230 L 125 230 Z" fill="#FBBF24"/>
  <rect x="128" y="175" width="65" height="8" fill="#10B981"/>
  <rect x="126" y="195" width="68" height="8" fill="#10B981"/>

  <!-- Arm Reaching out to place block -->
  <path d="M 140 170 Q 105 160 85 140" fill="none" stroke="#FDE2D0" stroke-width="16" stroke-linecap="round"/>
  <circle cx="85" cy="140" r="10" fill="#FDE2D0"/>

  <!-- Head -->
  <circle cx="160" cy="115" r="32" fill="#FDE2D0"/>

  <!-- Short Dark Brown Hair -->
  <path d="M 128 115 C 128 85 192 85 192 115 C 192 100 185 90 160 90 C 135 90 128 100 128 115 Z" fill="#451A03"/>

  <!-- Happy Face -->
  <ellipse cx="150" cy="115" rx="4" ry="5" fill="#1F2937"/>
  <ellipse cx="170" cy="115" rx="4" ry="5" fill="#1F2937"/>
  <path d="M 152 128 Q 160 138 168 128" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="142" cy="122" r="5" fill="#F87171" opacity="0.5"/>
  <circle cx="178" cy="122" r="5" fill="#F87171" opacity="0.5"/>

  <!-- More Colorful Blocks Scattered on Right -->
  <rect x="220" y="225" width="34" height="34" rx="4" fill="#8B5CF6"/>
  <rect x="235" y="195" width="30" height="30" rx="4" fill="#0D5BE1"/>
  <circle cx="130" cy="245" r="12" fill="#EC4899"/>
</svg>
