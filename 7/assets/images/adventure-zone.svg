<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Adventure Zone (6-8 Years) - Girl on Indoor Climbing Wall -->
  <defs>
    <linearGradient id="wallWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8CD"/>
      <stop offset="100%" stop-color="#F6D3A7"/>
    </linearGradient>
  </defs>

  <!-- Wooden Climbing Wall with Holes -->
  <rect width="300" height="300" fill="url(#wallWood)"/>
  <g fill="#D4A771" opacity="0.5">
    <circle cx="40" cy="40" r="4"/><circle cx="100" cy="40" r="4"/><circle cx="160" cy="40" r="4"/><circle cx="220" cy="40" r="4"/><circle cx="280" cy="40" r="4"/>
    <circle cx="40" cy="100" r="4"/><circle cx="100" cy="100" r="4"/><circle cx="160" cy="100" r="4"/><circle cx="220" cy="100" r="4"/><circle cx="280" cy="100" r="4"/>
    <circle cx="40" cy="160" r="4"/><circle cx="100" cy="160" r="4"/><circle cx="160" cy="160" r="4"/><circle cx="220" cy="160" r="4"/><circle cx="280" cy="160" r="4"/>
    <circle cx="40" cy="220" r="4"/><circle cx="100" cy="220" r="4"/><circle cx="160" cy="220" r="4"/><circle cx="220" cy="220" r="4"/><circle cx="280" cy="220" r="4"/>
  </g>

  <!-- Colorful Climbing Grips -->
  <path d="M 50 80 Q 70 70 80 90 Q 60 100 50 80 Z" fill="#EF4444"/>
  <path d="M 120 40 Q 140 30 150 50 Q 130 60 120 40 Z" fill="#3B82F6"/>
  <path d="M 230 70 Q 250 65 255 85 Q 235 95 230 70 Z" fill="#10B981"/>
  <path d="M 60 210 Q 80 200 90 220 Q 70 230 60 210 Z" fill="#F59E0B"/>
  <path d="M 240 180 Q 260 170 265 190 Q 245 200 240 180 Z" fill="#8B5CF6"/>
  <path d="M 200 240 Q 220 230 230 250 Q 210 260 200 240 Z" fill="#EF4444"/>

  <!-- Girl Climbing (Side/Back View, White Top, Blue Jeans) -->
  <!-- Left Leg extended down on a grip -->
  <path d="M 150 200 L 120 240 L 95 240" fill="none" stroke="#2563EB" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="90" cy="240" rx="10" ry="7" fill="#F59E0B"/> <!-- Shoe -->

  <!-- Right Leg bent stepping on grip -->
  <path d="M 170 190 L 185 220 L 195 210" fill="none" stroke="#2563EB" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="202" cy="210" rx="10" ry="7" fill="#F59E0B"/> <!-- Shoe -->

  <!-- Torso (White Athletic Tee) -->
  <path d="M 140 135 L 180 130 L 175 195 L 145 195 Z" fill="#FFFFFF"/>
  <rect x="140" y="135" width="40" height="6" fill="#F43F5E"/>

  <!-- Left Arm reaching for grip -->
  <path d="M 145 140 Q 120 110 85 90" fill="none" stroke="#FDE2D0" stroke-width="14" stroke-linecap="round"/>
  <circle cx="85" cy="90" r="8" fill="#FDE2D0"/>

  <!-- Right Arm reaching high up -->
  <path d="M 175 135 Q 185 85 155 50" fill="none" stroke="#FDE2D0" stroke-width="14" stroke-linecap="round"/>
  <circle cx="155" cy="50" r="8" fill="#FDE2D0"/>

  <!-- Head with Ponytail -->
  <circle cx="160" cy="110" r="22" fill="#FDE2D0"/>
  <!-- Hair -->
  <circle cx="162" cy="105" r="23" fill="#92400E"/>
  <!-- Ponytail swing -->
  <path d="M 175 105 Q 205 110 215 130 Q 195 125 180 115 Z" fill="#92400E"/>
  <circle cx="178" cy="108" r="5" fill="#EF4444"/> <!-- Hair tie -->
</svg>
