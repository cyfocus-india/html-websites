<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Super Play Birthday Suite (Bauhaus Style) -->
  <defs>
    <radialGradient id="bgSuper" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="60%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgSuper)"/>

  <!-- Floor -->
  <rect x="0" y="230" width="300" height="70" fill="#E2E8F0"/>
  <line x1="0" y1="230" x2="300" y2="230" stroke="#0D5BE1" stroke-width="3"/>

  <!-- Bauhaus Geometric Wall Art -->
  <path d="M 40 180 A 70 70 0 0 1 180 180 Z" fill="#E52E2E" opacity="0.85"/>
  <circle cx="210" cy="110" r="45" fill="#F5B300" opacity="0.9"/>
  <polygon points="120,40 165,115 75,115" fill="#0D5BE1" opacity="0.85"/>

  <!-- Birthday Banner -->
  <path d="M 20 40 Q 150 70 280 40" fill="none" stroke="#64748B" stroke-width="2"/>
  <!-- Pennants -->
  <polygon points="35,43 55,47 45,68" fill="#E52E2E"/>
  <polygon points="75,50 95,53 85,74" fill="#0D5BE1"/>
  <polygon points="115,55 135,56 125,78" fill="#F5B300"/>
  <polygon points="155,56 175,55 165,77" fill="#10B981"/>
  <polygon points="195,54 215,51 205,73" fill="#E52E2E"/>
  <polygon points="235,48 255,44 245,67" fill="#0D5BE1"/>

  <!-- Giant Party Balloons Bunches -->
  <!-- Left Bunch -->
  <circle cx="45" cy="100" r="16" fill="#0D5BE1"/>
  <circle cx="65" cy="85" r="17" fill="#E52E2E"/>
  <circle cx="35" cy="75" r="15" fill="#F5B300"/>
  <line x1="48" y1="100" x2="60" y2="195" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Right Bunch -->
  <circle cx="255" cy="100" r="16" fill="#F5B300"/>
  <circle cx="235" cy="85" r="17" fill="#0D5BE1"/>
  <circle cx="265" cy="75" r="15" fill="#E52E2E"/>
  <line x1="252" y1="100" x2="240" y2="195" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Modern Party Table -->
  <rect x="65" y="195" width="170" height="40" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="75" y="195" width="150" height="5" fill="#0D5BE1"/>

  <!-- Birthday Cake -->
  <rect x="120" y="170" width="60" height="25" rx="3" fill="#E52E2E"/>
  <rect x="120" y="170" width="60" height="5" fill="#FFFFFF"/>
  <rect x="132" y="152" width="36" height="18" rx="2" fill="#F5B300"/>
  <rect x="132" y="152" width="36" height="4" fill="#FFFFFF"/>
  <rect x="148" y="142" width="4" height="10" fill="#0D5BE1"/>
  <ellipse cx="150" cy="138" rx="3" ry="5" fill="#EF4444"/>

  <!-- Party Hats on Table -->
  <polygon points="85,195 97,175 109,195" fill="#F5B300"/>
  <polygon points="190,195 202,175 214,195" fill="#E52E2E"/>

  <!-- Stacks of Wrapped Presents on Floor -->
  <rect x="30" y="215" width="32" height="32" rx="3" fill="#E52E2E"/>
  <rect x="43" y="215" width="6" height="32" fill="#F5B300"/>
  <rect x="30" y="228" width="32" height="6" fill="#F5B300"/>

  <rect x="238" y="220" width="28" height="28" rx="3" fill="#0D5BE1"/>
  <rect x="250" y="220" width="5" height="28" fill="#FFFFFF"/>
  <rect x="238" y="231" width="28" height="5" fill="#FFFFFF"/>
</svg>
