<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Royal Castle Celebration Suite -->
  <defs>
    <radialGradient id="bgRoyal" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="55%" stop-color="#F5D0FE"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgRoyal)"/>

  <!-- Floor -->
  <rect x="0" y="230" width="300" height="70" fill="#F3E8FF"/>
  <line x1="0" y1="230" x2="300" y2="230" stroke="#C084FC" stroke-width="2.5"/>

  <!-- Castle Silhouette & Arch on Wall -->
  <rect x="70" y="70" width="160" height="160" rx="80" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="2"/>
  <!-- Castle Turrets -->
  <rect x="100" y="100" width="25" height="60" fill="#DDD6FE"/>
  <polygon points="95,100 125,100 112,70" fill="#8B5CF6"/>
  <rect x="175" y="100" width="25" height="60" fill="#DDD6FE"/>
  <polygon points="170,100 200,100 187,70" fill="#8B5CF6"/>
  <rect x="125" y="115" width="50" height="45" fill="#C4B5FD"/>
  <path d="M 137 160 Q 150 142 163 160 Z" fill="#6D28D9"/>

  <!-- Royal Golden Crown Symbol -->
  <polygon points="130,55 136,40 144,48 150,34 156,48 164,40 170,55" fill="url(#goldGrad)" stroke="#A16207" stroke-width="1"/>
  <circle cx="150" cy="52" r="3" fill="#EF4444"/>
  <circle cx="140" cy="52" r="2.5" fill="#3B82F6"/>
  <circle cx="160" cy="52" r="2.5" fill="#10B981"/>

  <!-- Balloon Garland Arch (Left & Right) -->
  <circle cx="45" cy="80" r="16" fill="#F472B6"/>
  <circle cx="55" cy="105" r="18" fill="#C084FC"/>
  <circle cx="40" cy="130" r="15" fill="#FDE047"/>
  <circle cx="50" cy="155" r="16" fill="#67E8F9"/>
  <circle cx="42" cy="180" r="17" fill="#FB7185"/>

  <circle cx="255" cy="80" r="16" fill="#C084FC"/>
  <circle cx="245" cy="105" r="18" fill="#F472B6"/>
  <circle cx="260" cy="130" r="15" fill="#67E8F9"/>
  <circle cx="250" cy="155" r="16" fill="#FDE047"/>
  <circle cx="258" cy="180" r="17" fill="#A855F7"/>

  <!-- Royal Celebration Table -->
  <rect x="75" y="190" width="150" height="42" rx="4" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="2"/>
  <path d="M 75 190 Q 90 200 105 190 Q 120 200 135 190 Q 150 200 165 190 Q 180 200 195 190 Q 210 200 225 190" fill="none" stroke="#F472B6" stroke-width="3"/>

  <!-- Royal Tiered Cake -->
  <rect x="125" y="168" width="50" height="22" rx="3" fill="#F472B6"/>
  <rect x="135" y="152" width="30" height="16" rx="2" fill="url(#goldGrad)"/>
  <rect x="148" y="142" width="4" height="10" fill="#E2E8F0"/>
  <ellipse cx="150" cy="137" rx="3" ry="5" fill="#F59E0B"/>

  <!-- Golden Goblets on Table -->
  <polygon points="90,178 100,178 97,185 93,185" fill="url(#goldGrad)"/>
  <polygon points="200,178 210,178 207,185 203,185" fill="url(#goldGrad)"/>

  <!-- Sparkles & Confetti -->
  <polygon points="80,110 82,116 88,118 82,120 80,126 78,120 72,118 78,116" fill="#FACC15"/>
  <polygon points="220,110 222,116 228,118 222,120 220,126 218,120 212,118 218,116" fill="#FACC15"/>
</svg>
