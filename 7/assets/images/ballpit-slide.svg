<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Ball Pit & Slide Circular Feature Window for Safety Section -->
  <defs>
    <radialGradient id="ballpitBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <rect width="400" height="400" fill="url(#ballpitBg)"/>

    <!-- Indoor Play Structure in Background -->
    <rect x="50" y="40" width="300" height="180" rx="12" fill="#1E40AF"/>
    <rect x="70" y="60" width="110" height="140" fill="#EF4444" rx="8"/>
    <rect x="220" y="60" width="110" height="140" fill="#10B981" rx="8"/>

    <!-- Bright Yellow Spiral Slide coming down into pit -->
    <path d="M 180 80 Q 240 140 210 230 Q 190 280 140 320 L 100 290 Q 150 250 160 210 Q 180 150 140 100 Z" fill="#F5B300"/>
    <path d="M 180 80 Q 240 140 210 230 Q 190 280 140 320" fill="none" stroke="#D97706" stroke-width="16" stroke-linecap="round"/>
    <path d="M 140 100 Q 180 150 160 210 Q 150 250 100 290" fill="none" stroke="#D97706" stroke-width="14" stroke-linecap="round"/>

    <!-- Sea of Ball Pit Balls in Foreground (Yellow, Blue, Red, Cyan, Green) -->
    <!-- Dense layered balls -->
    <g>
      <!-- Layer 1 -->
      <circle cx="40" cy="300" r="16" fill="#EF4444"/><circle cx="80" cy="305" r="16" fill="#F59E0B"/>
      <circle cx="120" cy="295" r="16" fill="#10B981"/><circle cx="160" cy="300" r="16" fill="#3B82F6"/>
      <circle cx="200" cy="290" r="16" fill="#EC4899"/><circle cx="240" cy="300" r="16" fill="#F59E0B"/>
      <circle cx="280" cy="295" r="16" fill="#EF4444"/><circle cx="320" cy="300" r="16" fill="#10B981"/>
      <circle cx="360" cy="290" r="16" fill="#3B82F6"/>

      <!-- Layer 2 -->
      <circle cx="20" cy="330" r="16" fill="#F59E0B"/><circle cx="60" cy="325" r="16" fill="#3B82F6"/>
      <circle cx="100" cy="330" r="16" fill="#EF4444"/><circle cx="140" cy="320" r="16" fill="#F59E0B"/>
      <circle cx="180" cy="325" r="16" fill="#10B981"/><circle cx="220" cy="320" r="16" fill="#3B82F6"/>
      <circle cx="260" cy="330" r="16" fill="#EF4444"/><circle cx="300" cy="325" r="16" fill="#F59E0B"/>
      <circle cx="340" cy="330" r="16" fill="#10B981"/><circle cx="380" cy="320" r="16" fill="#EC4899"/>

      <!-- Layer 3 -->
      <circle cx="40" cy="355" r="16" fill="#10B981"/><circle cx="80" cy="350" r="16" fill="#F59E0B"/>
      <circle cx="120" cy="355" r="16" fill="#3B82F6"/><circle cx="160" cy="350" r="16" fill="#EF4444"/>
      <circle cx="200" cy="355" r="16" fill="#F59E0B"/><circle cx="240" cy="350" r="16" fill="#10B981"/>
      <circle cx="280" cy="355" r="16" fill="#3B82F6"/><circle cx="320" cy="350" r="16" fill="#EF4444"/>
      <circle cx="360" cy="355" r="16" fill="#F59E0B"/>

      <!-- Layer 4 -->
      <circle cx="20" cy="380" r="16" fill="#3B82F6"/><circle cx="60" cy="385" r="16" fill="#EF4444"/>
      <circle cx="100" cy="380" r="16" fill="#10B981"/><circle cx="140" cy="385" r="16" fill="#F59E0B"/>
      <circle cx="180" cy="380" r="16" fill="#3B82F6"/><circle cx="220" cy="385" r="16" fill="#EF4444"/>
      <circle cx="260" cy="380" r="16" fill="#F59E0B"/><circle cx="300" cy="385" r="16" fill="#10B981"/>
      <circle cx="340" cy="380" r="16" fill="#3B82F6"/><circle cx="380" cy="385" r="16" fill="#EF4444"/>
    </g>
  </g>
</svg>
