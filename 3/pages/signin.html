<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#661f3f"><meta name="description" content="Sign in to your Rosewood Florals account."><title>Sign In — Rosewood Florals</title>
  <link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="../assets/js/main.js" defer></script>

<body data-root=".." data-page="signin"><div data-site-header></div><main id="main" class="auth-page"><section class="auth-card" data-reveal><p class="eyebrow">Sign In</p><h1>Your flowers,<br><span class="display-italic">all in one place.</span></h1><form data-validate data-success="Demo sign-in complete."><div class="form-grid"><div class="field"><label for="signin-email">Email address</label><input id="signin-email" name="email" type="email" autocomplete="email" required><p class="error-message" aria-live="polite"></p></div><div class="field"><label for="signin-password">Password</label><input id="signin-password" name="password" type="password" autocomplete="current-password" minlength="8" required><p class="error-message" aria-live="polite"></p></div><button class="btn btn-primary" type="submit">Sign In</button><p class="form-success" role="status">You’re signed in to this front-end demo.</p></div></form><p class="auth-links">New to Rosewood? <a href="signup.html">Sign Up</a></p></section></main><div data-site-footer></div></body>
</html>
