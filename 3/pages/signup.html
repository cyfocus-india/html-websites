<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#661f3f"><meta name="description" content="Create a Rosewood Florals account for quicker gifting and order history."><title>Sign Up — Rosewood Florals</title>
  <link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="../assets/js/main.js" defer></script>
</head>
<body data-root=".." data-page="signup"><div data-site-header></div><main id="main" class="auth-page"><section class="auth-card" data-reveal><p class="eyebrow">Sign Up</p><h1>Make thoughtful<br><span class="display-italic">gifting easier.</span></h1><form data-validate data-success="Your demo account is ready."><div class="form-grid"><div class="field"><label for="signup-name">Full name</label><input id="signup-name" name="name" autocomplete="name" required><p class="error-message" aria-live="polite"></p></div><div class="field"><label for="signup-email">Email address</label><input id="signup-email" name="email" type="email" autocomplete="email" required><p class="error-message" aria-live="polite"></p></div><div class="field"><label for="signup-password">Password</label><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required><p class="error-message" aria-live="polite"></p></div><button class="btn btn-primary" type="submit">Sign Up</button><p class="form-success" role="status">Your account is ready in this front-end demo.</p></div></form><p class="auth-links">Already have an account? <a href="signin.html">Sign in</a></p></section></main><div data-site-footer></div></body>
</html>
