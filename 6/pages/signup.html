<!doctype html>
<html lang="en" dir="ltr"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create an Ironlane Moto Works demonstration rider profile."><meta name="theme-color" content="#111211"><title>Sign Up | Ironlane Moto Works</title>
  <script>document.documentElement.dataset.theme=localStorage.getItem('ironlane-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dir=localStorage.getItem('ironlane-direction')||'ltr';</script><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css">
</head><body data-root="../" data-page="signup"><div data-site-header></div><main id="main-content" class="auth-shell"><section class="auth-card"><div class="form-shell reveal"><span class="section-kicker">Rider account demo</span><h1 style="font-size:clamp(2.8rem,10vw,4.5rem)">Create a <span class="accent">profile.</span></h1><p class="section-intro">Front-end demonstration only. Connect a secure identity provider before production.</p>
  <form data-validate data-success="Demo profile validated. No account was created or stored." novalidate><div class="form-grid two-col"><div class="field"><label for="signup-name">Name <span aria-hidden="true">*</span></label><input id="signup-name" name="name" type="text" autocomplete="name" minlength="2" required aria-describedby="signup-name-error"><p class="field-error" id="signup-name-error" aria-live="polite"></p></div><div class="field"><label for="signup-phone">Phone</label><input id="signup-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" pattern="[0-9+() -]{8,18}" aria-describedby="signup-phone-error"><p class="field-error" id="signup-phone-error" aria-live="polite"></p></div></div><div class="field"><label for="signup-email">Email <span aria-hidden="true">*</span></label><input id="signup-email" name="email" type="email" autocomplete="email" required aria-describedby="signup-email-error"><p class="field-error" id="signup-email-error" aria-live="polite"></p></div><div class="field"><label for="signup-password">Password <span aria-hidden="true">*</span></label><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="signup-password-error"><p class="field-error" id="signup-password-error" aria-live="polite"></p></div><button class="btn" style="width:100%" type="submit">Create demo profile</button><p class="form-status" data-form-status tabindex="-1" role="status"></p></form><p class="form-note">Already registered? <a href="signin.html">Sign in</a>. By continuing, you acknowledge the <a href="terms.html">terms</a>.</p>
  </div></section></main><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="../assets/js/main.js" defer></script></body></html>
