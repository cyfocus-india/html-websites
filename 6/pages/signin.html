<!doctype html>
<html lang="en" dir="ltr"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign in to the Ironlane Moto Works demonstration rider account."><meta name="theme-color" content="#111211"><title>Sign In | Ironlane Moto Works</title>
  <script>document.documentElement.dataset.theme=localStorage.getItem('ironlane-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dir=localStorage.getItem('ironlane-direction')||'ltr';</script><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css">
</head><body data-root="../" data-page="signin"><div data-site-header></div><main id="main-content" class="auth-shell"><section class="auth-card"><div class="form-shell reveal"><span class="section-kicker">Rider account demo</span><h1 style="font-size:clamp(2.8rem,10vw,4.5rem)">Welcome <span class="accent">back.</span></h1><p class="section-intro">Front-end demonstration only. No account data is transmitted or stored.</p>
  <form data-validate data-success="Demo sign-in validated. Connect this form to a secure authentication service before production." novalidate><div class="field"><label for="signin-email">Email <span aria-hidden="true">*</span></label><input id="signin-email" name="email" type="email" autocomplete="email" required aria-describedby="signin-email-error"><p class="field-error" id="signin-email-error" aria-live="polite"></p></div><div class="field"><label for="signin-password">Password <span aria-hidden="true">*</span></label><input id="signin-password" name="password" type="password" autocomplete="current-password" minlength="8" required aria-describedby="signin-password-error"><p class="field-error" id="signin-password-error" aria-live="polite"></p></div><button class="btn" style="width:100%" type="submit">Sign in</button><p class="form-status" data-form-status tabindex="-1" role="status"></p></form><p class="form-note">No account? <a href="signup.html">Create a demo profile</a>. <a href="../index.html">Return home</a>.</p>
  </div></section></main><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script><script src="../assets/js/main.js" defer></script></body></html>
