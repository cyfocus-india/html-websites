<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign in to the Meeple &amp; Marrow demonstration account area."><meta name="theme-color" content="#f5f0e7"><title>Sign In | Meeple &amp; Marrow</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css"><script defer src="../assets/js/main.js"></script>
</head>
<body data-root=".." data-page="signin">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div data-site-header></div>
  <main id="main-content" class="auth-shell">
    <section class="auth-card" aria-labelledby="signin-title" data-reveal="scale">
      <span class="eyebrow">Welcome back</span>
      <h1 id="signin-title">Your table is waiting.</h1>
      <p>Sign in to keep wishlists and event preferences together. Demo only—no account is created.</p>
      <form class="form-grid" data-validate data-success="Demo sign-in complete. Welcome back to Meeple & Marrow!" novalidate>
        <div class="field">
          <label for="signin-email">Email address</label>
          <input id="signin-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="signin-email-error">
          <p class="field-error" id="signin-email-error"></p>
        </div>
        <div class="field">
          <label for="signin-password">Password</label>
          <div class="field--password">
            <input id="signin-password" name="password" type="password" autocomplete="current-password" minlength="8" required aria-describedby="signin-password-error">
            <button class="password-toggle" type="button" data-toggle-password aria-label="Show password"><span data-icon="eye"></span></button>
          </div>
          <p class="field-error" id="signin-password-error"></p>
        </div>
        <div class="field-row-flex">
          <label class="field-checkbox">
            <input type="checkbox" name="remember" checked>
            <span>Remember me</span>
          </label>
          <a class="text-link" href="coming-soon.html" style="font-size:0.7rem;"><span>Forgot password?</span></a>
        </div>
        <button class="btn btn--full" type="submit"><span>Sign in</span><span data-icon="arrow-right"></span></button>
      </form>
      <p class="auth-switch">New here? <a class="text-link" href="signup.html"><span>Create an account</span></a></p>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
